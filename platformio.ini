; APHound — ESP32-S3 Wi-Fi AP fox-hunter (Geiger locator) for LilyGo T-Display-S3
; The T-Display-S3 drives its ST7789 over an 8-bit PARALLEL bus and needs GPIO15
; (PWR_ON) held HIGH to power the LCD + battery rail — both handled in firmware.
[platformio]
default_envs = tdisplay-s3

; ---- LilyGo T-Display-S3 (ST7789, external buzzer) -------------------------
[env:tdisplay-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<main.cpp>

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  ; --- USB CDC so Serial works over the native USB-C port ---
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; --- TFT_eSPI: LilyGo T-Display-S3 (ST7789, 170x320, 8-bit parallel) ---
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DINIT_SEQUENCE_3
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_PARALLEL_8_BIT
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_INVERSION_ON
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_CS=6
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_GFXFF
  -DSMOOTH_FONT
  -DSPI_FREQUENCY=27000000

; ---- M5StickC Plus 1.1 (built-in screen + buzzer + battery; M5Unified) -------
; Also runs on the M5 Cardputer and other M5 boards — M5Unified auto-detects.
[env:m5stickc-plus]
platform = espressif32@6.5.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main_m5.cpp>
lib_deps =
  m5stack/M5Unified@^0.1.16
